<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffb8d3">
<title>Um cofrinho secreto ♡</title>
<style>
:root{--pink:#ffb8d3;--hot:#ec5f98;--cream:#fff9f2;--ink:#613349;--line:#f0aec8}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 14% 20%,#ffd9e7 0 8%,transparent 9%),radial-gradient(ellipse at 88% 76%,#fca9ca 0 11%,transparent 12%),var(--pink);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:grid;place-items:center;padding:24px;overflow-x:hidden}.wrap{width:min(100%,520px);text-align:center;position:relative}.spark{position:absolute;font-size:28px;color:white;animation:float 3s ease-in-out infinite}.s1{top:10%;left:4%}.s2{right:4%;top:25%;animation-delay:.7s}.s3{bottom:8%;left:9%;animation-delay:1s}@keyframes float{50%{transform:translateY(-9px) rotate(12deg)}}.card{background:var(--cream);border:3px solid white;border-radius:32px;padding:30px 28px 32px;box-shadow:0 15px 0 #df78a3,0 22px 42px #9d386133}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:#bd6687;font-weight:800}.pig{width:184px;height:160px;margin:3px auto 4px;display:block;filter:drop-shadow(0 6px 0 #f3bad0)}h1{font-size:clamp(26px,7vw,36px);line-height:1.05;margin:7px 0 9px;color:#a83e6b}.lead{margin:0 0 20px;font-size:15px;color:#81546a}.timer{display:inline-flex;align-items:center;gap:8px;border:2px solid #f6c5d7;background:#fff0f6;border-radius:999px;padding:8px 17px;margin-bottom:17px;font-weight:800;font-size:13px}.digits{font-variant-numeric:tabular-nums;color:#d93478;font-size:22px;min-width:47px}.slots{display:flex;justify-content:center;gap:9px;margin:0 auto 19px}.slots input{width:clamp(39px,12vw,52px);height:58px;border:2px solid var(--line);border-radius:15px;background:white;text-align:center;font-size:25px;font-weight:800;color:var(--ink);outline:none;box-shadow:0 3px 0 #f8d8e4}.slots input:focus{border-color:var(--hot);box-shadow:0 0 0 4px #ed6d9c30}.btn{border:0;border-radius:999px;background:var(--hot);color:white;padding:13px 28px;font:700 16px inherit;cursor:pointer;box-shadow:0 5px 0 #b84372;transition:.15s transform,.15s box-shadow}.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #b84372}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b84372}.msg{min-height:22px;margin:16px 0 0;font-size:14px;color:#d13e78;font-weight:700}.tiny{font-size:12px;color:#a57389;margin-top:16px}.screen{display:none}.screen.active{display:block}.video-card{width:min(100%,900px)}video{display:block;width:100%;max-height:72vh;border-radius:20px;background:#321725;margin:18px auto}.back{margin-top:8px;background:#f2d2df;color:#82405d;box-shadow:0 5px 0 #dca2ba}.expired{opacity:.52;pointer-events:none}@media(max-width:420px){.card{padding:24px 15px 26px}.slots{gap:6px}.slots input{height:53px}.pig{width:158px;height:140px}}
</style></head><body>
<span class="spark s1">✦</span><span class="spark s2">♡</span><span class="spark s3">✧</span>
<main class="wrap"><section class="card screen active" id="gate" aria-labelledby="title"><div class="eyebrow">♡ clube do cofrinho ♡</div>
<svg class="pig" viewBox="0 0 220 190" role="img" aria-label="Porquinho cofrinho rosa com laço"><path d="M51 61 37 23q-2-9 9-5l45 24M169 60l15-37q2-9-9-5l-44 24" fill="#ffa9c8" stroke="#9c496a" stroke-width="5" stroke-linejoin="round"/><path d="m40 29 39 19-19 9zM180 29l-39 19 19 9z" fill="#ffd4e3"/><path d="M79 117c-17-9-28-23-26-42 2-22 22-39 57-40 38-1 66 18 69 47 2 17-5 29-17 38 3 15 0 31-12 39-13 9-25 2-32-7-17 9-34 12-49 3-12-7-14-22-11-38z" fill="#ffb4cd" stroke="#9c496a" stroke-width="5"/><ellipse cx="62" cy="94" rx="24" ry="17" fill="#ffcadb" stroke="#9c496a" stroke-width="5"/><circle cx="55" cy="93" r="3.6" fill="#a54169"/><circle cx="70" cy="93" r="3.6" fill="#a54169"/><path d="M105 72q7-9 14 0M150 72q7-9 14 0" fill="none" stroke="#713850" stroke-width="5" stroke-linecap="round"/><circle cx="98" cy="84" r="5" fill="#ed7097" opacity=".75"/><circle cx="163" cy="84" r="5" fill="#ed7097" opacity=".75"/><path d="M98 48q-4-9 3-16l13 9 13-9q7 7 3 16l-16 8z" fill="#fff1a8" stroke="#9c496a" stroke-width="4"/><path d="M101 120h53" stroke="#9c496a" stroke-width="5" stroke-linecap="round"/><path d="M94 166v12m55-12v12" stroke="#9c496a" stroke-width="8" stroke-linecap="round"/></svg>
<h1 id="title">Qual é o segredo?</h1><p class="lead">Você tem 60 segundos para descobrir o código!</p><div class="timer" aria-live="polite">⏱ TEMPO <span class="digits" id="time">60</span> s</div>
<form id="form"><div class="slots" aria-label="Senha de seis dígitos">${''}</div><button class="btn" type="submit">Abrir o cofrinho ♡</button></form><p class="msg" id="msg" aria-live="polite"></p><p class="tiny">Tentativas neste dispositivo: <strong id="attempt-count">0</strong> ✿</p></section>
<section class="card video-card screen" id="gift"><div class="eyebrow">✿ surpresa desbloqueada ✿</div><h1>Um presente pra você!</h1><p class="lead">Acomode-se e aproveite o clipe ♡</p><video id="player" controls playsinline preload="metadata"><source src="clipe.mp4" type="video/mp4">Seu navegador não consegue reproduzir este vídeo.</video><button class="btn back" id="again">Voltar ao cofrinho</button></section></main>
<script>
// O código deste jogo foi definido como 230526 (6 dígitos).
const code='230526', form=document.querySelector('#form'), slots=document.querySelector('.slots'), msg=document.querySelector('#msg'), time=document.querySelector('#time'), gate=document.querySelector('#gate'), gift=document.querySelector('#gift'), player=document.querySelector('#player');
const attemptsKey='cofrinhoTentativas', attemptCount=document.querySelector('#attempt-count'); let attempts=Number(localStorage.getItem(attemptsKey)||0); attemptCount.textContent=attempts;
for(let i=0;i<6;i++){const input=document.createElement('input');input.inputMode='numeric';input.pattern='[0-9]*';input.maxLength=1;input.autocomplete=i===0?'one-time-code':'off';input.setAttribute('aria-label',`Dígito ${i+1}`);input.required=true;slots.append(input)}
const fields=[...slots.querySelectorAll('input')];fields.forEach((f,i)=>{f.addEventListener('input',()=>{f.value=f.value.replace(/\D/g,'').slice(-1);if(f.value&&i<5)fields[i+1].focus()});f.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!f.value&&i>0)fields[i-1].focus()});f.addEventListener('paste',e=>{const v=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);if(v){e.preventDefault();v.split('').forEach((n,j)=>fields[j].value=n);fields[Math.min(v.length,5)].focus()}})});
let left=60;const tick=setInterval(()=>{left--;time.textContent=left;if(left<=0){clearInterval(tick);gate.classList.add('expired');msg.textContent='O tempo acabou! Recarregue a página para tentar de novo.'}},1000);
form.addEventListener('submit',e=>{e.preventDefault();if(left<=0)return;const guess=fields.map(f=>f.value).join('');attempts++;localStorage.setItem(attemptsKey,String(attempts));attemptCount.textContent=attempts;if(guess===code){clearInterval(tick);gate.classList.remove('active');gift.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});player.play().catch(()=>{})}else{msg.textContent='Esse código não abriu… tente outra combinação!';fields.forEach(f=>f.value='');fields[0].focus()}});
document.querySelector('#again').addEventListener('click',()=>{player.pause();player.currentTime=0;gift.classList.remove('active');gate.classList.add('active');left=60;time.textContent=left;gate.classList.remove('expired');msg.textContent='';fields.forEach(f=>f.value='');clearInterval(tick);window.location.reload()});
</script></body></html>
